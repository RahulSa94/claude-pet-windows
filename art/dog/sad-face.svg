                    <ellipse cx="100" cy="124" rx="36" ry="42" fill="#D97706"/>
                    <ellipse cx="100" cy="128" rx="24" ry="30" fill="#FEF3C7"/>

                    <!-- Head Drooped -->
                    <circle cx="100" cy="80" r="32" fill="#D97706"/>
                    <ellipse cx="100" cy="90" rx="16" ry="12" fill="#FEF3C7"/>
                    <ellipse cx="100" cy="84" rx="5" ry="4" fill="#1E293B"/>

